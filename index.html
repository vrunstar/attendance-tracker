<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Attendance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131a;
    --bg-alt:#0d0e13;
    --card:#1b1d27;
    --card-hi:#22242f;
    --border:#2a2d3a;
    --text:#eef0f5;
    --text-dim:#9498a8;
    --text-faint:#5f6373;
    --gold:#f2b544;
    --gold-dim:#8a6a2c;
    --green:#3ecf7e;
    --green-bg:#173a29;
    --red:#f2455c;
    --red-bg:#3a1720;
    --free:#2c2e39;
    --free-text:#6a6e7f;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #1c1e2c 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; }

  /* ---------- Top bar ---------- */
  .topbar{
    padding:18px 16px 10px;
    text-align:center;
  }
  .topbar .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .topbar h1{
    margin:4px 0 0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .topbar .sub{
    margin-top:2px;
    font-size:12.5px;
    color:var(--text-faint);
  }

  /* ---------- Sticky summary ---------- */
  .summary-wrap{
    position:sticky;
    top:0;
    z-index:50;
    padding:10px 12px 12px;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .summary-card{
    background:linear-gradient(155deg, var(--card-hi), var(--card));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
  .summary-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .pct-block{
    text-align:center;
  }
  .pct-block .pct{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
  }
  .pct-block .pct-label{
    font-size:10.5px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-top:4px;
    white-space:nowrap;
  }
  .pct-divider{
    font-size:22px;
    font-weight:300;
    color:var(--border);
    align-self:center;
  }
  #projectedPctValue{ color:var(--gold); }

  .stat-mini-row{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:12px;
  }
  .stat-mini-row .val{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    font-weight:600;
    margin-right:5px;
  }
  .stat-mini-row .lab{
    font-size:10.5px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .bar-outer{
    position:relative;
    margin-top:14px;
    height:14px;
    border-radius:999px;
    background:#0f1017;
    border:1px solid var(--border);
    overflow:visible;
  }
  .bar-inner{
    height:100%;
    border-radius:999px;
    transition:width .45s cubic-bezier(.22,1,.36,1), background-color .3s;
    position:relative;
  }
  .bar-inner::after{
    content:"";
    position:absolute; inset:0;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.25), transparent 60%);
  }
  .target-tick{
    position:absolute;
    top:-4px;
    bottom:-4px;
    width:2px;
    background:var(--gold);
    left:65%;
    box-shadow:0 0 8px 1px rgba(242,181,68,.6);
  }
  .target-tick::before{
    content:"65%";
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    font-size:9.5px;
    color:var(--gold);
    font-weight:600;
    white-space:nowrap;
  }

  .buffer-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    gap:10px;
  }
  .buffer-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    padding:8px 12px;
    border-radius:999px;
  }
  .buffer-chip .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 6px 1px rgba(242,181,68,.7);
  }
  .buffer-chip span.num{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .buffer-chip span.txt{
    font-size:11.5px;
    color:var(--text-dim);
  }
  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text-faint);
    font-size:11px;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:.2s;
  }
  .reset-btn:active{ transform:scale(.95); background:var(--card-hi); }

  /* ---------- Weeks / days ---------- */
  .content{
    max-width:640px;
    margin:0 auto;
    padding:4px 12px 0;
  }
  .week-heading{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:26px 4px 12px;
  }
  .week-heading .num{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.05em;
  }
  .week-heading .range{
    font-size:11.5px;
    color:var(--text-faint);
  }
  .week-line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--border), transparent);
  }

  .day-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 14px 16px;
    margin-bottom:12px;
  }
  .day-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .day-title{
    display:flex;
    align-items:baseline;
    gap:7px;
  }
  .day-head .wd{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15.5px;
  }
  .day-head .dt{
    font-size:11.5px;
    color:var(--text-faint);
    font-weight:500;
  }
  .day-progress{
    font-size:10.5px;
    color:var(--text-faint);
    background:var(--bg-alt);
    padding:3px 9px;
    border-radius:999px;
    border:1px solid var(--border);
  }

  .day-body{
    display:flex;
    align-items:stretch;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
  }
  .day-body::-webkit-scrollbar{ height:4px; }
  .day-body::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .cell{
    flex:0 0 auto;
    width:74px;
    border-radius:var(--radius-sm);
    padding:6px 6px;
    min-height:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    transition:transform .12s ease, background-color .25s, box-shadow .25s;
    user-select:none;
    position:relative;
  }
  .cell .name{
    font-weight:600;
    font-size:12.5px;
    line-height:1.15;
  }

  .cell.free{
    background:var(--free);
    color:var(--free-text);
    cursor:default;
  }
  .cell.free .name{ font-weight:500; font-size:12px; letter-spacing:.04em; }

  .cell.attended{
    background:var(--green-bg);
    color:var(--green);
    box-shadow:inset 0 0 0 1px rgba(62,207,126,.35);
    cursor:pointer;
  }
  .cell.missed{
    background:var(--red-bg);
    color:var(--red);
    box-shadow:inset 0 0 0 1px rgba(242,69,92,.4);
    cursor:pointer;
  }
  .cell.attended:active, .cell.missed:active{ transform:scale(.96); }

  .cell.lab{
    width:154px;
    flex-direction:row;
    justify-content:center;
    gap:8px;
  }
  .cell.lab .name{ font-size:13px; }

  footer{
    text-align:center;
    color:var(--text-faint);
    font-size:10.5px;
    margin-top:30px;
    padding:0 20px;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="eyebrow">Semester Tracker</div>
    <h1>Attendance</h1>
    <div class="sub">14 Jul – 14 Aug 2026 · Target 65%</div>
  </div>

  <div class="summary-wrap">
    <div class="summary-card">
      <div class="summary-top">
        <div class="pct-block">
          <div class="pct" id="pctValue">0%</div>
          <div class="pct-label">Current</div>
        </div>
        <div class="pct-divider">|</div>
        <div class="pct-block">
          <div class="pct" id="projectedPctValue">0%</div>
          <div class="pct-label">Projected · 14 Aug</div>
        </div>
      </div>

      <div class="stat-mini-row">
        <div>
          <span class="val" id="attendedValue">0</span>
          <span class="lab">Attended</span>
        </div>
        <div>
          <span class="val" id="totalValue">0</span>
          <span class="lab">Total</span>
        </div>
      </div>

      <div class="bar-outer">
        <div class="bar-inner" id="barInner" style="width:0%"></div>
        <div class="target-tick"></div>
      </div>

      <div class="buffer-row">
        <div class="buffer-chip">
          <span class="dot"></span>
          <span class="num" id="bufferValue">0</span>
          <span class="txt" id="bufferLabel">classes can be missed</span>
        </div>
        <button class="reset-btn" id="resetBtn">Reset all</button>
      </div>
    </div>
  </div>

  <div class="content" id="weeksContainer"></div>

  <footer>Tap a class or lab to toggle attended / missed.<br>Free periods aren't counted. Data is saved on this device only.</footer>

<script>
(function(){
  "use strict";

  /* ---------------- Config ---------------- */
  const BASE_ATTENDED = 34;
  const BASE_TOTAL = 73;
  const TARGET = 0.65;
  const START_DATE = new Date(2026, 6, 14);  // 14 Jul 2026
  const END_DATE   = new Date(2026, 7, 14);  // 14 Aug 2026
  const STORAGE_KEY = "attendance_tracker_v1";

  // weekday index: 0=Sun ... 6=Sat
  const TIMETABLE = {
    1: [ // Monday
      {periods:[1], type:"free"},
      {periods:[2], type:"free"},
      {periods:[3], type:"free"},
      {periods:[4], type:"free"},
      {periods:[5], type:"free"},
      {periods:[6], type:"free"},
    ],
    2: [ // Tuesday
      {periods:[1], type:"free"},
      {periods:[2], type:"class", name:"CPS"},
      {periods:[3], type:"class", name:"ML"},
      {periods:[4], type:"class", name:"INS"},
      {periods:[5], type:"free"},
      {periods:[6], type:"free"},
    ],
    3: [ // Wednesday
      {periods:[1], type:"free"},
      {periods:[2], type:"free"},
      {periods:[3], type:"class", name:"INS"},
      {periods:[4], type:"class", name:"ML"},
      {periods:[5,6], type:"lab", name:"STQA"},
    ],
    4: [ // Thursday
      {periods:[1], type:"free"},
      {periods:[2], type:"class", name:"ML"},
      {periods:[3,4], type:"lab", name:"ML"},
      {periods:[5], type:"free"},
      {periods:[6], type:"class", name:"STQA"},
    ],
    5: [ // Friday
      {periods:[1], type:"class", name:"INS"},
      {periods:[2], type:"class", name:"ML"},
      {periods:[3], type:"free"},
      {periods:[4], type:"free"},
      {periods:[5,6], type:"lab", name:"INS"},
    ],
    6: [ // Saturday
      {periods:[1], type:"class", name:"STQA"},
      {periods:[2], type:"class", name:"INS"},
      {periods:[3,4], type:"lab", name:"STQA"},
      {periods:[5,6], type:"lab", name:"Bootcamp"},
    ],
  };

  const WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  /* ---------------- State ---------------- */
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {overrides:{}};
    }catch(e){ return {overrides:{}}; }
  }
  function saveState(state){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  let state = loadState();

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function fmtDate(d){
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  }

  function itemId(dateStr, periods){
    return dateStr + "_p" + periods.join("-");
  }
  function isAttended(id){
    const v = state.overrides[id];
    return v !== "missed"; // default attended
  }
  function toggle(id){
    if(isAttended(id)){
      state.overrides[id] = "missed";
    } else {
      delete state.overrides[id];
    }
    saveState(state);
  }

  /* ---------------- Generate schedule ---------------- */
  function saturdayOccurrence(d){
    return Math.ceil(d.getDate() / 7); // 1st, 2nd, 3rd... Saturday of the month
  }

  function generateDays(){
    const days = [];
    let d = new Date(START_DATE);
    while(d <= END_DATE){
      const wd = d.getDay();
      if(wd !== 0){ // skip Sunday
        const isOddSaturday = wd === 6 && saturdayOccurrence(d) % 2 === 1;
        if(!isOddSaturday){
          days.push({
            date: new Date(d),
            dateStr: dateKey(d),
            weekday: wd,
            blocks: TIMETABLE[wd],
          });
        }
      }
      d.setDate(d.getDate()+1);
    }
    return days;
  }

  function groupWeeks(days){
    const weeks = [];
    let current = null;
    days.forEach(day=>{
      if(day.weekday === 1 || current === null){
        current = {days:[]};
        weeks.push(current);
      }
      current.days.push(day);
    });
    return weeks;
  }

  /* ---------------- Stats ---------------- */
  function computeStats(days){
    let genTotal = 0, genAttended = 0;
    days.forEach(day=>{
      day.blocks.forEach(b=>{
        if(b.type === "free") return;
        genTotal += 1;
        const id = itemId(day.dateStr, b.periods);
        if(isAttended(id)) genAttended += 1;
      });
    });
    const attended = BASE_ATTENDED + genAttended;
    const total = BASE_TOTAL + genTotal;
    const pct = total > 0 ? (attended/total)*100 : 0;

    let buffer, bufferLabel;
    if(pct >= TARGET*100){
      buffer = Math.floor((attended - TARGET*total) / TARGET);
      bufferLabel = "classes can be missed";
    } else {
      const needed = Math.ceil((TARGET*total - attended) / (1-TARGET));
      buffer = needed;
      bufferLabel = "classes needed to hit 65%";
    }
    return {attended, total, pct, buffer, bufferLabel};
  }

  function renderSummary(days){
    const todayKey = dateKey(new Date());
    const daysSoFar = days.filter(d => d.dateStr <= todayKey);

    // If today is before the tracked range starts, show base-only stats as "current".
    const current = computeStats(daysSoFar);
    const projected = computeStats(days);

    document.getElementById("pctValue").textContent = current.pct.toFixed(1) + "%";
    document.getElementById("attendedValue").textContent = current.attended;
    document.getElementById("totalValue").textContent = current.total;
    document.getElementById("bufferValue").textContent = current.buffer;
    document.getElementById("bufferLabel").textContent = current.bufferLabel;

    const bar = document.getElementById("barInner");
    const width = Math.max(0, Math.min(100, current.pct));
    bar.style.width = width + "%";
    let color;
    if(current.pct < 60) color = "var(--red)";
    else if(current.pct < 65) color = "var(--gold)";
    else color = "var(--green)";
    bar.style.background = color;

    document.getElementById("projectedPctValue").textContent = projected.pct.toFixed(1) + "%";
  }

  /* ---------------- Rendering ---------------- */
  function cellEl(day, block){
    if(block.type === "free"){
      const el = document.createElement("div");
      el.className = "cell free";
      el.innerHTML = `<div class="name">FREE</div>`;
      return el;
    }

    const id = itemId(day.dateStr, block.periods);
    const attended = isAttended(id);
    const el = document.createElement("div");
    el.className = "cell " + (block.type === "lab" ? "lab " : "") + (attended ? "attended" : "missed");
    el.dataset.id = id;

    el.innerHTML = `<div class="name">${block.name}</div>`;

    el.addEventListener("click", ()=>{
      toggle(id);
      const nowAttended = isAttended(id);
      el.classList.toggle("attended", nowAttended);
      el.classList.toggle("missed", !nowAttended);
      renderSummary(allDays);
    });

    return el;
  }

  function dayCard(day){
    const card = document.createElement("div");
    card.className = "day-card";

    const genTotal = day.blocks.filter(b=>b.type!=="free").length;
    const genAttended = day.blocks.filter(b=>b.type!=="free" && isAttended(itemId(day.dateStr,b.periods))).length;

    card.innerHTML = `
      <div class="day-head">
        <div class="day-title">
          <span class="wd">${WEEKDAY_NAMES[day.weekday]}</span>
          <span class="dt">${fmtDate(day.date)}</span>
        </div>
        <div class="day-progress">${genTotal ? genAttended + "/" + genTotal : "Free day"}</div>
      </div>
    `;

    const row = document.createElement("div");
    row.className = "day-body";

    day.blocks.forEach(block=>{
      row.appendChild(cellEl(day, block));
    });

    card.appendChild(row);
    return card;
  }

  function renderWeeks(weeks){
    const container = document.getElementById("weeksContainer");
    container.innerHTML = "";
    weeks.forEach((week, idx)=>{
      const heading = document.createElement("div");
      heading.className = "week-heading";
      const first = week.days[0].date, last = week.days[week.days.length-1].date;
      heading.innerHTML = `
        <span class="num">WEEK ${idx+1}</span>
        <span class="range">${fmtDate(first)} – ${fmtDate(last)}</span>
        <span class="week-line"></span>
      `;
      container.appendChild(heading);

      week.days.forEach(day=>{
        container.appendChild(dayCard(day));
      });
    });
  }

  /* ---------------- Init ---------------- */
  const allDays = generateDays();
  const weeks = groupWeeks(allDays);
  renderWeeks(weeks);
  renderSummary(allDays);

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Reset all attendance overrides back to default (all future classes attended)?")){
      state = {overrides:{}};
      saveState(state);
      renderWeeks(weeks);
      renderSummary(allDays);
    }
  });

})();
</script>
</body>
</html>
